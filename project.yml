name: HyperGO
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HyperGO:
    type: application
    platform: iOS
    sources:
      - HyperGO
    info:
      path: HyperGO/Info.plist
      properties:
        CFBundleDisplayName: HyperGO
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 用于在地图上显示你的位置，并计算到各个地点的距离和最短路线。
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - maps
          - waze
    settings:
      base:
        # 免费 Apple ID 要求 Bundle ID 全球唯一，请改成你自己的，例如 com.你的名字.hypergo
        PRODUCT_BUNDLE_IDENTIFIER: com.dehaohuang.hypergo
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AG35R2KFF7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
